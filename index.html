<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Россия — федеральные округа </title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#071226;color:#eef4ff}body{background:radial-gradient(circle at 50% 45%,#132d55 0,#071226 52%,#030915 100%)}
#app{position:fixed;inset:0;overflow:hidden}.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:50px 50px;transform:perspective(800px) rotateX(45deg) scale(1.5);transform-origin:center bottom;pointer-events:none}
#scene{position:absolute;left:0;top:0;width:2600px;height:1800px;transform-origin:0 0;transition:transform 900ms cubic-bezier(.2,.8,.2,1)}
.connection{position:absolute;height:3px;transform-origin:left center;background:linear-gradient(90deg,rgba(110,180,255,.6),rgba(110,180,255,.08));border-radius:10px;filter:drop-shadow(0 0 7px rgba(80,170,255,.25));pointer-events:none}
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 35px rgba(0,0,0,.35),inset 0 0 30px rgba(255,255,255,.06);cursor:pointer;user-select:none;transition:filter .35s,opacity .35s,transform .35s}.node:hover{filter:brightness(1.16)}
.center{width:250px;height:250px;border-radius:50%;left:1175px;top:775px;background:radial-gradient(circle at 35% 30%,#315b91,#16345f 55%,#0b1e3c);font-weight:800;flex-direction:column;gap:10px;z-index:3}.center .flag{display:flex;width:86px;height:10px;border-radius:4px;overflow:hidden}.center .flag i{flex:1}.center small{font-weight:500;opacity:.75;font-size:15px}
.district{width:180px;height:180px;border-radius:50%;z-index:2;color:#fff;padding:20px}.district b{font-size:22px;line-height:1.05}.district small{display:block;margin-top:10px;opacity:.72;font-size:12px}.district .dot{width:12px;height:12px;border-radius:50%;position:absolute;top:17px;right:22px;background:#fff;box-shadow:0 0 15px #fff}
.region{height:58px;min-width:150px;padding:0 18px;border-radius:18px;background:rgba(13,32,61,.94);backdrop-filter:blur(8px);font-size:14px;z-index:4;border-color:rgba(255,255,255,.15)}
.region:hover{transform:scale(1.06)}
.hidden{opacity:0!important;pointer-events:none!important}.dim{opacity:.12!important;filter:blur(1px)}
#hud{position:fixed;left:28px;right:28px;top:22px;display:flex;justify-content:space-between;align-items:flex-start;z-index:20;pointer-events:none}.brand{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}.crumb{margin-top:9px;font-size:13px;opacity:.65}.hint{padding:10px 14px;border:1px solid rgba(255,255,255,.13);background:rgba(5,16,33,.58);border-radius:14px;backdrop-filter:blur(10px);font-size:12px;opacity:.8}
#panel{position:fixed;right:28px;top:100px;width:min(390px,calc(100vw - 56px));max-height:calc(100vh - 170px);overflow:auto;padding:25px;border-radius:24px;background:rgba(7,19,39,.9);border:1px solid rgba(255,255,255,.16);box-shadow:0 25px 80px rgba(0,0,0,.45);backdrop-filter:blur(18px);z-index:30;transform:translateX(30px);opacity:0;pointer-events:none;transition:.4s}.panel-on{transform:none!important;opacity:1!important;pointer-events:auto!important}.panel-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}.panel h2{margin:8px 0 10px;font-size:30px}.panel p{line-height:1.55;color:#d5e1f5;font-size:14px}.panel .regions{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.tag{font-size:12px;padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09)}
.controls{position:fixed;bottom:24px;left:28px;display:flex;gap:8px;z-index:25}.controls button{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(7,19,39,.75);color:white;font-size:20px;cursor:pointer}.controls button:hover{background:rgba(40,75,120,.8)}
#back{position:fixed;bottom:24px;right:28px;z-index:25;padding:11px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(7,19,39,.75);color:white;cursor:pointer;opacity:0;pointer-events:none;transition:.3s}.back-on{opacity:1!important;pointer-events:auto!important}
#intro{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:20;font-size:12px;opacity:.5;white-space:nowrap}
@media(max-width:700px){.hint{display:none}.panel{top:auto;bottom:80px;right:12px;width:calc(100vw - 24px);max-height:48vh}.controls{left:12px}.center{width:210px;height:210px}.district{width:145px;height:145px}.district b{font-size:17px}}
</style></head>
<body>
<div id="app"><div class="grid"></div><div id="scene"></div>
<div id="hud"><div><div class="brand">Россия · интерактивная карта</div><div class="crumb" id="crumb">Обзор → 8 федеральных округов</div><div class="crumb">Диабате Тумуссике · РГМБ26-1</div></div><div class="hint">Нажми на округ, затем на регион · колесо мыши — zoom</div></div>
<div id="panel"><div class="panel-label" id="pLabel"></div><h2 id="pTitle"></h2><p id="pText"></p><div class="regions" id="pRegions"></div></div>
<div class="controls"><button id="minus">−</button><button id="plus">+</button><button id="home">⌂</button></div><button id="back">← Retour</button></div>
<script>
const D=[
['Центральный','#e5484d',['Белгородская область','Брянская область','Владимирская область','Воронежская область','Ивановская область','Калужская область','Костромская область','Курская область','Липецкая область','Московская область','Орловская область','Рязанская область','Смоленская область','Тамбовская область','Тверская область','Тульская область','Ярославская область','г. Москва']],
['Северо-Западный','#2a9d8f',['Республика Карелия','Республика Коми','Архангельская область','Ненецкий автономный округ','Вологодская область','Калининградская область','Ленинградская область','Мурманская область','Новгородская область','Псковская область','г. Санкт-Петербург']],
['Южный','#f4a261',['Республика Адыгея','Республика Калмыкия','Краснодарский край','Астраханская область','Волгоградская область','Ростовская область','Республика Крым *','г. Севастополь *']],
['Северо-Кавказский','#b5179e',['Республика Дагестан','Республика Ингушетия','Кабардино-Балкарская Республика','Карачаево-Черкесская Республика','Респ. Северная Осетия — Алания','Чеченская Республика','Ставропольский край']],
['Приволжский','#4895ef',['Республика Башкортостан','Республика Марий Эл','Республика Мордовия','Республика Татарстан','Удмуртская Республика','Чувашская Республика','Пермский край','Кировская область','Нижегородская область','Оренбургская область','Пензенская область','Самарская область','Саратовская область','Ульяновская область']],
['Уральский','#90be6d',['Курганская область','Свердловская область','Тюменская область','Ханты-Мансийский автономный округ — Югра','Ямало-Ненецкий АО','Челябинская область']],
['Сибирский','#7bdff2',['Республика Алтай','Республика Бурятия','Республика Тыва','Республика Хакасия','Алтайский край','Красноярский край','Забайкальский край','Иркутская область','Кемеровская область','Новосибирская область','Омская область','Томская область']],
['Дальневосточный','#ffd166',['Республика Саха (Якутия)','Камчатский край','Приморский край','Хабаровский край','Амурская область','Магаданская область','Сахалинская область','Еврейская авт. область','Чукотский АО']]
];
const desc={
'Центральный':'Округ в центральной части России. Включает Москву и прилегающие области.','Северо-Западный':'Округ на северо-западе страны, с выходом к Балтийскому морю и северным морям.','Южный':'Округ на юге европейской части России, включающий регионы Северного Причерноморья и Нижнего Дона.','Северо-Кавказский':'Округ на Северном Кавказе, объединяющий республики региона и Ставропольский край.','Приволжский':'Округ вдоль Волги и в Приуралье, с большим числом республик, краёв и областей.','Уральский':'Округ, охватывающий Урал и часть Западной Сибири; включает крупные промышленные регионы.','Сибирский':'Крупный округ в Сибири, от Алтая до Красноярского края и Забайкалья.','Дальневосточный':'Самый восточный округ России, с выходом к Тихому океану и большим количеством удалённых территорий.'};
const scene=document.getElementById('scene'), panel=document.getElementById('panel'), crumb=document.getElementById('crumb'), back=document.getElementById('back');
let districts=[], regions=[], level=0,current=-1,scale=1;
function el(cls,txt){let x=document.createElement('div');x.className=cls;if(txt)x.textContent=txt;return x}
function line(x1,y1,x2,y2,cls='connection'){let l=el(cls);let dx=x2-x1,dy=y2-y1;l.style.left=x1+'px';l.style.top=y1+'px';l.style.width=Math.hypot(dx,dy)+'px';l.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;scene.appendChild(l);return l}
const cx=1300,cy=900;
const angles=[-90,-45,0,45,90,135,180,225];
D.forEach((d,i)=>{let a=angles[i]*Math.PI/180,x=cx+520*Math.cos(a),y=cy+330*Math.sin(a);let n=el('node district');n.style.left=(x-90)+'px';n.style.top=(y-90)+'px';n.style.background=`radial-gradient(circle at 35% 25%,${d[1]},#102746)`;n.innerHTML=`<span><i class="dot"></i><b>${d[0]}</b><small>федеральный округ · ${d[2].length} субъектов</small></span>`;n.onclick=()=>focusDistrict(i);scene.appendChild(n);districts.push(n);line(cx,cy,x,y);});
let c=el('node center');c.innerHTML='<div class="flag"><i style="background:#fff"></i><i style="background:#2877d4"></i><i style="background:#e34b4b"></i></div><strong>РОССИЯ</strong><small>8 федеральных округов</small>';c.onclick=home;scene.appendChild(c);
function clearRegions(){regions.forEach(r=>r.remove());regions=[]}
function focusDistrict(i){level=1;current=i;clearRegions();districts.forEach((n,j)=>n.classList.toggle('dim',j!==i));let d=D[i], n=districts[i],x=parseFloat(n.style.left)+90,y=parseFloat(n.style.top)+90;d[2].forEach((name,j)=>{let a=(-160+j*360/d[2].length)*Math.PI/180;let rx=x+270*Math.cos(a),ry=y+210*Math.sin(a);let r=el('node region',name);r.style.left=(rx-85)+'px';r.style.top=(ry-29)+'px';r.style.borderColor=d[1];r.onclick=e=>{e.stopPropagation();focusRegion(name,d,i)};scene.appendChild(r);regions.push(r);line(x,y,rx,ry);});
panel.classList.remove('panel-on');crumb.textContent='Россия → '+d[0];back.classList.add('back-on');camera(x,y,1.45)}
function focusRegion(name,d,i){level=2;let n=regions.find(x=>x.textContent===name);let x=parseFloat(n.style.left)+85,y=parseFloat(n.style.top)+29;regions.forEach(r=>r.classList.toggle('dim',r!==n));showPanel('Регион',name,'Элемент выбранного федерального округа. Нажми «← Retour», чтобы вернуться к округу.',[]);crumb.textContent='Россия → '+d[0]+' → '+name;camera(x,y,2.7)}
function showPanel(label,title,text,list){document.getElementById('pLabel').textContent=label;document.getElementById('pTitle').textContent=title;document.getElementById('pText').textContent=text;let box=document.getElementById('pRegions');box.innerHTML='';list.forEach(x=>{let t=el('span','');t.className='tag';t.textContent=x;box.appendChild(t)});panel.classList.add('panel-on')}
function camera(x,y,s){scale=s;let vw=innerWidth,vh=innerHeight;scene.style.transform=`translate(${vw/2-x*s}px,${vh/2-y*s}px) scale(${s})`}
function home(){level=0;current=-1;clearRegions();districts.forEach(n=>n.classList.remove('dim'));regions.forEach(r=>r.classList.remove('dim'));panel.classList.remove('panel-on');back.classList.remove('back-on');crumb.textContent='Обзор → 8 федеральных округов';camera(cx,cy,.72)}
back.onclick=()=>level===2?focusDistrict(current):home();document.getElementById('home').onclick=home;document.getElementById('plus').onclick=()=>{scale*=1.18;camera(cx,cy,scale)};document.getElementById('minus').onclick=()=>{scale/=1.18;camera(cx,cy,scale)};
app.addEventListener('wheel',e=>{e.preventDefault();let s=scale*(e.deltaY<0?1.1:.9);scale=Math.max(.45,Math.min(4,s));camera(cx,cy,scale)},{passive:false});
addEventListener('resize',()=>{if(level===0)camera(cx,cy,scale)});addEventListener('keydown',e=>{if(e.key==='Escape')back.click();if(e.key==='Home')home()});home();
</script></body></html>
